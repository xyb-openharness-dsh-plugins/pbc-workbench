<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="小管宝 DuctPal · 原发性胆汁性胆管炎（PBC）患者工作台原型（虚构示例）">
<title>小管宝 DuctPal · PBC 工作台（原型）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%235C6B3C'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23F7F6EF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="primer.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="flower" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="2.4"/><circle cx="12" cy="5.6" r="2"/><circle cx="18.4" cy="12" r="2"/>
          <circle cx="12" cy="18.4" r="2"/><circle cx="5.6" cy="12" r="2"/>
        </g>
      </svg>
      <span class="brand-name">小管宝</span>
      <span class="brand-en">DuctPal</span>
      <span class="version-chip" id="version-chip">v0.1.0 · 原型</span>
    </div>
    <p class="statusline" id="statusline">虚构示例 · 演示「记录 → 对照 → 带走」三步</p>
    <div class="actions">
      <button class="icon-btn" id="primer-open" type="button" data-primer-open
              aria-label="疾病概要：定义、医学资料与指南情况、治疗全景、发展趋势"
              title="疾病概要：定义 · 指南 · 治疗全景 · 趋势">?</button>
      <button class="btn ghost" id="profile-btn" type="button" aria-haspopup="listbox">切换档案</button>
      <!-- AI 对话＝宿主原生会话（页面不自建聊天窗） -->
      <button class="btn" id="btn-ai" type="button" data-state="ready" aria-label="AI 对话：请宿主打开原生会话">对话</button>
    </div>
  </header>

  <div class="frame" id="frame">
    <nav class="sidenav" id="sidenav" aria-label="功能线"></nav>
    <main class="main" id="main" tabindex="-1">
      <div class="subtabs" id="subtabs" role="tablist" aria-label="子页"></div>
      <section class="view" id="view"></section>
    </main>
  </div>

  <footer class="footer">
    <span>本工具只做资料整理与就诊准备，不构成医疗建议。</span>
    <span class="footer-meta">演示数据全部虚构 · <span id="footer-profile">档案 A</span> · <span id="footer-built">原型 v0.1.0</span></span>
  </footer>
</div>

<div class="page-view" id="page" hidden>
  <div class="page-head">
    <button class="btn ghost" id="page-back" type="button">← 返回</button>
    <h2 id="page-title">详情</h2>
    <button class="icon-btn" id="page-close" type="button" aria-label="关闭整页">×</button>
  </div>
  <div class="page-body" id="page-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="demo-data.js"></script>
<script src="primer-data.js"></script>
<script src="app.js"></script>
<script src="bridge.js"></script>
<script src="primer.js"></script>
</body>
</html>
